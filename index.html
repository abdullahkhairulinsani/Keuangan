<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Catatan Keuangan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#0f766e;--bd:#e3e6ea;--rd:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1e2328;--tx:#eceff3;--mu:#9aa3ad;--ac:#2dd4bf;--bd:#2f363d;--rd:#f87171}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px}
input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:11px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.x{background:none;color:var(--rd);padding:4px 8px}
.row{display:flex;gap:8px}.row>*{flex:1}
#st{font-size:13px;color:var(--mu);margin-top:8px;min-height:18px}
.big{font-size:26px;font-weight:700}
.it{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.it:first-child{border-top:0}.it .m{flex:1;min-width:0}.it .m small{color:var(--mu);display:block}
.sm{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
</style>
</head>
<body>
<main>
<h1>🧾 Catatan Keuangan</h1>
<div class="card">
  <label for="tgl">Tanggal</label><input id="tgl" type="date">
  <label for="toko">Toko / keterangan</label><input id="toko" type="text" placeholder="Contoh: Indomaret">
  <div class="row">
    <div><label for="kat">Kategori</label><select id="kat"></select></div>
    <div><label for="tot">Total (Rp)</label><input id="tot" type="number" inputmode="numeric" min="0"></div>
  </div>
  <p><button id="simpan" style="width:100%">Simpan</button></p>
  <div id="st"></div>
</div>
<div class="card">
  <div style="color:var(--mu);font-size:13px">Pengeluaran bulan ini</div>
  <div class="big" id="bln">Rp 0</div>
  <div id="sum" style="margin-top:8px"></div>
</div>
<div class="card">
  <div class="row" style="align-items:center;margin-bottom:6px">
    <strong>Riwayat</strong>
    <button class="sec" id="xl">Unduh Excel</button>
  </div>
  <div id="list"></div>
</div>
</main>
<script>
const KAT=['Makan','Belanja','Transport','Tagihan','Kesehatan','Lainnya'];
const $=id=>document.getElementById(id);
const rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const hari=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let rows=[];
try{rows=JSON.parse(localStorage.getItem('keuangan')||'[]')}catch(e){}
const simpanLokal=()=>{try{localStorage.setItem('keuangan',JSON.stringify(rows))}catch(e){}};
$('kat').innerHTML=KAT.map(k=>'<option>'+k+'</option>').join('');
$('tgl').value=hari();

$('simpan').onclick=()=>{
  const total=Number($('tot').value);
  if(!total||total<=0){$('st').textContent='Isi total pengeluaran dulu.';return}
  rows.push({id:Date.now(),tgl:$('tgl').value||hari(),toko:$('toko').value.trim()||'-',kat:$('kat').value,total});
  simpanLokal();
  $('toko').value='';$('tot').value='';$('tgl').value=hari();
  $('st').textContent='Tersimpan.';render();
};

function render(){
  const bulan=hari().slice(0,7);
  const ini=rows.filter(r=>r.tgl.slice(0,7)===bulan);
  $('bln').textContent=rp(ini.reduce((a,r)=>a+r.total,0));
  const per={};ini.forEach(r=>per[r.kat]=(per[r.kat]||0)+r.total);
  $('sum').innerHTML=Object.entries(per).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div class="sm"><span>'+k+'</span><span>'+rp(v)+'</span></div>').join('')||'<div style="color:var(--mu)">Belum ada catatan bulan ini.</div>';
  const L=$('list');L.textContent='';
  [...rows].sort((a,b)=>b.tgl.localeCompare(a.tgl)||b.id-a.id).forEach(r=>{
    const d=document.createElement('div');d.className='it';
    const m=document.createElement('div');m.className='m';
    const t=document.createElement('div');t.textContent=r.toko+' · '+rp(r.total);
    const s=document.createElement('small');s.textContent=r.tgl+' · '+r.kat;
    m.append(t,s);
    const x=document.createElement('button');x.className='x';x.textContent='Hapus';
    x.onclick=()=>{rows=rows.filter(q=>q.id!==r.id);simpanLokal();render()};
    d.append(m,x);L.append(d);
  });
  if(!rows.length)L.innerHTML='<div style="color:var(--mu)">Belum ada riwayat.</div>';
}

function unduh(blob,nama){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nama;
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
$('xl').onclick=()=>{
  if(!rows.length){$('st').textContent='Belum ada data untuk diunduh.';return}
  const data=[...rows].sort((a,b)=>a.tgl.localeCompare(b.tgl));
  if(window.XLSX){
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Tanggal','Toko','Kategori','Total (Rp)'],...data.map(r=>[r.tgl,r.toko,r.kat,r.total])]),'Catatan');
    const per={};data.forEach(r=>{const k=r.tgl.slice(0,7)+'|'+r.kat;per[k]=(per[k]||0)+r.total});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Bulan','Kategori','Total (Rp)'],...Object.entries(per).sort().map(([k,v])=>[...k.split('|'),v])]),'Ringkasan');
    unduh(new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/octet-stream'}),'catatan-keuangan.xlsx');
  }else{
    const csv='Tanggal,Toko,Kategori,Total\n'+data.map(r=>[r.tgl,'"'+r.toko.replace(/"/g,'""')+'"',r.kat,r.total].join(',')).join('\n');
    unduh(new Blob([csv],{type:'text/csv'}),'catatan-keuangan.csv');
    $('st').textContent='Pustaka Excel belum termuat, file diunduh sebagai CSV (bisa dibuka di Excel).';
  }
};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
